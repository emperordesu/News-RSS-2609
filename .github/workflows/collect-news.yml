name: Collect News

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run collect

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update news data [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
